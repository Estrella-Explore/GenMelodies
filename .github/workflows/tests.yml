name: Tests
on: [push, pull_request]
jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install existing Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile the MIT MP3 decoder
        run: python tools/build_audio_decoder.py
      - name: Test file decoding, rhythm and MIDI pipeline
        run: python -m unittest discover -s tests -v
